<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="depTitle depDesc">
  <title id="depTitle">Despliegue recomendado de Turnero</title>
  <desc id="depDesc">Topologia de produccion: clientes de la sucursal, Nginx con TLS, Gunicorn con un worker, aplicacion Flask y base SQLite, supervisados por systemd.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      .title { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #94a3b8; }
      .panel { fill: #111c2e; stroke: #243b5a; stroke-width: 1.5; }
      .panel-soft { fill: #0d1728; stroke: #1e3554; stroke-width: 1.2; }
      .box-title { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #e2e8f0; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 11.5px; fill: #7dd3fc; }
      .small { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .tiny { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #64748b; }
      .label { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .bullet { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .legend { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#topline)"/>

  <text class="title" x="60" y="58">Despliegue recomendado</text>
  <text class="subtitle" x="60" y="84">Nginx termina TLS, Gunicorn ejecuta un unico worker y SQLite vive en el mismo servidor.</text>

  <!-- Clientes -->
  <rect class="panel" x="50" y="120" width="260" height="200" rx="14"/>
  <text class="box-title" x="70" y="152">Clientes de la sucursal</text>
  <text class="mono" x="70" y="180">Display · TV</text>
  <text class="mono" x="70" y="204">Kiosco · tablet</text>
  <text class="mono" x="70" y="228">Ejecutivo · PC + camara</text>
  <text class="small" x="70" y="262">Misma LAN o Wi-Fi</text>
  <text class="tiny" x="70" y="288">Navegador moderno · sin instalacion</text>

  <line x1="310" y1="220" x2="348" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="329" y="209" text-anchor="middle">HTTPS · 443</text>

  <!-- Nginx -->
  <rect class="panel" x="356" y="150" width="220" height="150" rx="14"/>
  <text class="box-title" x="376" y="182">Nginx</text>
  <text class="small" x="376" y="208">Reverse proxy + TLS</text>
  <text class="mono" x="376" y="234">192.0.2.10</text>
  <text class="small" x="376" y="258">proxy_buffering off</text>
  <text class="tiny" x="376" y="280">necesario para SSE</text>

  <line x1="576" y1="220" x2="618" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="597" y="209" text-anchor="middle">proxy_pass</text>

  <!-- Gunicorn -->
  <rect class="panel" x="626" y="150" width="220" height="150" rx="14"/>
  <text class="box-title" x="646" y="182">Gunicorn</text>
  <text class="mono" x="646" y="208">127.0.0.1:8000</text>
  <text class="small" x="646" y="232">--workers 1</text>
  <text class="tiny" x="646" y="256">el bus SSE es por proceso</text>
  <text class="tiny" x="646" y="276">escalar solo con broker externo</text>

  <line x1="846" y1="220" x2="888" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="867" y="209" text-anchor="middle">WSGI</text>

  <!-- Flask -->
  <rect class="panel" x="896" y="150" width="230" height="150" rx="14"/>
  <text class="box-title" x="916" y="182">Flask</text>
  <text class="mono" x="916" y="208">create_app()</text>
  <text class="small" x="916" y="232">blueprints + servicios</text>
  <text class="small" x="916" y="254">SSE en memoria</text>
  <text class="tiny" x="916" y="276">debug desactivado</text>

  <!-- SQLite -->
  <line x1="1011" y1="300" x2="1011" y2="372" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text class="label" x="1023" y="340">SQLAlchemy</text>
  <rect class="panel-soft" x="896" y="380" width="230" height="100" rx="12"/>
  <text class="box-title" x="916" y="408" font-size="14">SQLite</text>
  <text class="mono" x="916" y="432">/opt/turnero/instance/</text>
  <text class="mono" x="916" y="452">turnero.db</text>
  <text class="tiny" x="916" y="470">respaldo diario del archivo</text>

  <!-- systemd -->
  <rect class="panel-soft" x="626" y="380" width="220" height="100" rx="12"/>
  <text class="box-title" x="646" y="408" font-size="14">systemd</text>
  <text class="mono" x="646" y="432">turnero.service</text>
  <text class="small" x="646" y="454">reinicio automatico</text>
  <text class="tiny" x="646" y="470">Restart=always</text>
  <line x1="736" y1="380" x2="736" y2="308" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrowDashed)"/>
  <text class="label" x="748" y="350">supervisa</text>

  <!-- CDN -->
  <rect class="panel-soft" x="50" y="400" width="260" height="90" rx="12" stroke-dasharray="5 5"/>
  <text class="box-title" x="70" y="428" font-size="14">cdn.jsdelivr.net</text>
  <text class="small" x="70" y="452">Bootstrap 5.3 · CSS y JS</text>
  <text class="tiny" x="70" y="472">requiere salida a internet</text>
  <line x1="180" y1="400" x2="180" y2="328" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrowDashed)"/>
  <text class="label" x="192" y="370">solo estilos</text>

  <!-- Checklist -->
  <rect class="panel" x="50" y="540" width="1076" height="154" rx="14"/>
  <text class="box-title" x="74" y="568">Checklist de produccion</text>
  <text class="bullet" x="74" y="596">• Definir SECRET_KEY y desactivar debug.</text>
  <text class="bullet" x="74" y="618">• Servir por HTTPS: la camara exige contexto seguro.</text>
  <text class="bullet" x="74" y="640">• Mantener un worker o externalizar el bus SSE.</text>
  <text class="bullet" x="574" y="596">• Configurar proxy_buffering off en Nginx.</text>
  <text class="bullet" x="574" y="618">• Respaldar instance/turnero.db antes de actualizar.</text>
  <text class="bullet" x="574" y="640">• Exponer solo 80/443; cerrar el puerto 5000.</text>
  <text class="tiny" x="74" y="672">Los valores 192.0.2.10 y /opt/turnero son placeholders de ejemplo (TEST-NET-1 y ruta generica).</text>

  <line x1="60" y1="710" x2="96" y2="710" stroke="#38bdf8" stroke-width="2"/>
  <text class="legend" x="104" y="714">HTTPS / HTTP</text>
  <line x1="226" y1="710" x2="262" y2="710" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text class="legend" x="270" y="714">Dependencia opcional o supervision</text>
</svg>
